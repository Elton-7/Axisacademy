name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Runs first and needs nothing installed, so a committed credential is caught
  # in seconds rather than after a full build. A secret that reaches the history
  # has to be rotated even once deleted, so the cheap check is the valuable one.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan tracked files for credentials
        run: node scripts/scan-secrets.mjs

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: axis_academy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axis_academy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -path './node_modules' -prune -o -name '*.js' -print)
      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: axis_academy
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-test-secret
          ADMIN_EMAIL: admin@axis.com
          ADMIN_PASSWORD_HASH: $2b$12$315i7r.6gTccRwfqogURl.HsH5ebZlQyEItCjV4t4H3iCcCYo6Uqm
          ADMIN_TEST_PASSWORD: ci-admin-password
          PORT: 5050
          NODE_ENV: test
        run: npm test
