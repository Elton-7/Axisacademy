<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Axis Learning creates personalised educational pathways for learners across Kenya." />
  <title>Axis Learning | Personalised Learning Pathways in Kenya</title>

  <!-- SVG first: browsers that support it get a mark that stays sharp on any
       display. The PNGs remain for those that do not, and for iOS. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta property="og:site_name" content="Axis Learning" />
  <meta property="og:locale" content="en_KE" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0a1628" />

  <!--
    Applies the theme before the first paint. This has to be inline and blocking:
    doing it from React would render the light palette first and then repaint,
    which is a visible flash on every page load and worse on a slow connection.
    A stored choice wins over the operating system preference.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('axis_theme')
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {
        // Private browsing can block localStorage; the light default is fine.
      }
    })()
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!--
    Structured data lives in the static HTML rather than being injected by React,
    so that crawlers and link scrapers which do not execute JavaScript still see
    it. Update the contact details and social profiles once Axis confirms them.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EducationalOrganization",
    "name": "Axis Learning",
    "alternateName": "Axis Learning / Guraxis Limited",
    "slogan": "Learn • Think • Create • Explore • Thrive",
    "description": "Axis Learning creates personalised educational pathways for learners through academic learning, homeschooling, tuition, special needs education, languages, sports, talent development, examination preparation and educational consultancy.",
    "url": "https://www.axislearning.co.ke",
    "telephone": "+254737003007",
    "areaServed": {
      "@type": "Country",
      "name": "Kenya"
    },
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Nairobi",
      "addressCountry": "KE"
    },
    "location": {
      "@type": "Place",
      "name": "Chandaria Innovation Centre — Kenyatta University",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Nairobi",
        "addressCountry": "KE"
      }
    },
    "knowsAbout": [
      "CBC", "Montessori", "Cambridge", "IGCSE", "A Levels", "IB",
      "Homeschooling", "Special needs education", "Language learning",
      "Examination preparation", "Educational consultancy"
    ]
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
