<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Axis Learning creates personalised educational pathways for learners across Kenya." />
  <title>Axis Learning | Personalised Learning Pathways in Kenya</title>

  <meta property="og:site_name" content="Axis Learning" />
  <meta property="og:locale" content="en_KE" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0a1628" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!--
    Structured data lives in the static HTML rather than being injected by React,
    so that crawlers and link scrapers which do not execute JavaScript still see
    it. Update the contact details and social profiles once Axis confirms them.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EducationalOrganization",
    "name": "Axis Learning",
    "alternateName": "Axis Learning / Guraxis Limited",
    "slogan": "Learn • Think • Create • Explore • Thrive",
    "description": "Axis Learning creates personalised educational pathways for learners through academic learning, homeschooling, tuition, special needs education, languages, sports, talent development, examination preparation and educational consultancy.",
    "url": "https://www.axislearning.co.ke",
    "telephone": "+254737003007",
    "areaServed": {
      "@type": "Country",
      "name": "Kenya"
    },
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Nairobi",
      "addressCountry": "KE"
    },
    "location": {
      "@type": "Place",
      "name": "Chandaria Innovation Centre — Kenyatta University",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Nairobi",
        "addressCountry": "KE"
      }
    },
    "knowsAbout": [
      "CBC", "Montessori", "Cambridge", "IGCSE", "A Levels", "IB",
      "Homeschooling", "Special needs education", "Language learning",
      "Examination preparation", "Educational consultancy"
    ]
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
