server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Prerendered routes are served as static files ($uri/ finds their directory
  # index). Anything left over falls back to the pristine shell rather than to
  # index.html, which is the prerendered homepage.
  location / {
    try_files $uri $uri/ /app.html;
  }

  location /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }
}
