# A local stack: Postgres, the API and the built site on one machine.
#
# This is not the deployment path — that is Netlify plus a Docker host, and it
# is described in docs/DEPLOYMENT.md. Everything here points at localhost, the
# database port is published to the host, and the server's source is mounted
# over the image, none of which belong in a deployment.
#
# Needs DB_PASSWORD and JWT_SECRET in a .env beside this file. See .env.example.

services:
  postgres:
    image: postgres:15-alpine
    container_name: axis-postgres
    environment:
      POSTGRES_DB: axis_academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: axis-server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: axis_academy
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      PORT: 5000
      # Development, deliberately. CORS points at localhost and the source is
      # mounted from the host, so calling this production was a contradiction —
      # and the production preflight refuses to start against a localhost
      # origin, which meant `docker compose up` could not boot the API at all.
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # Optional. Without them the seeder creates admin@axis.com on first run.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: axis-client
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
